[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geely-auto-ha"
version = "0.1.0"
description = "Safety-first Home Assistant custom integration scaffold for Geely Auto"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q -p no:cacheprovider --basetemp=.pytest-work"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".tools", "worktools", ".pytest-work", ".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/geely_auto/api/exceptions.py" = ["N818"]
"custom_components/geely_auto/api/signing.py" = ["PLR0913"]
"custom_components/geely_auto/api/gateway_signing.py" = ["PLR0913"]
"custom_components/geely_auto/captcha_views.py" = ["E501", "RUF001", "ARG002", "TRY400", "BLE001"]
"custom_components/geely_auto/config_flow.py" = ["C901", "PLR0912", "PLR0915", "TRY400", "TRY401", "BLE001"]
"custom_components/geely_auto/redaction.py" = ["ANN401"]
"scripts/**" = ["T201"]
"tests/**" = ["ANN", "ARG", "D", "N818", "PLC0415", "PLR2004", "S101", "S106", "SLF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["tests/"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*", "voluptuous"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["custom_components.geely_auto.config_flow"]
disable_error_code = ["call-arg", "misc", "no-any-return"]

[[tool.mypy.overrides]]
module = [
  "custom_components.geely_auto.captcha_views",
  "custom_components.geely_auto.coordinator",
  "custom_components.geely_auto.entity",
  "custom_components.geely_auto.sensor",
  "custom_components.geely_auto.binary_sensor",
]
disable_error_code = ["misc", "no-any-return"]

